# Build a Windows x86_64 VLC NSIS installer (.exe) plus a portable .zip.
#
# Mirrors the upstream GitLab "win64" / "nightly-win64" jobs from
# extras/ci/gitlab-ci.yml: same Docker image, same contrib SHA resolution,
# same prebuilt-contrib URL scheme and the same extras/package/win32/build.sh
# entry point. Only the build flags differ (release + NSIS/zip/7z, no MSI).
name: Windows installer

on:
  push:
    branches:
      - 'claude/**'
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with VLC_WIN64_IMAGE in extras/ci/gitlab-ci.yml
  VLC_WIN64_IMAGE: registry.videolan.org/vlc-debian-win64-posix:20260611225331
  TRIPLET: x86_64-w64-mingw32
  # uid of the "videolan" user the image runs as
  VIDEOLAN_UID: '499'

jobs:
  win64:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4
        with:
          # get-contrib-sha.sh walks history to find the last commit touching
          # contrib paths; trees are enough, so skip blobs of old commits.
          fetch-depth: 0
          filter: blob:none

      - name: Resolve prebuilt contrib URL
        id: contrib
        run: |
          # Same logic as the default before_script in extras/ci/gitlab-ci.yml
          VLC_CONTRIB_SHA="$(extras/ci/get-contrib-sha.sh win64)"
          URL="https://artifacts.videolan.org/vlc/win64/vlc-contrib-${TRIPLET}-${VLC_CONTRIB_SHA}.tar.zst"
          echo "sha=${VLC_CONTRIB_SHA}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Contrib SHA: ${VLC_CONTRIB_SHA}"
          if extras/ci/check-url.sh "$URL"; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No prebuilt contribs for ${VLC_CONTRIB_SHA}; build.sh will try the 'latest' tarball, then build contribs from source (slow)."
          fi

      - name: Cache prebuilt contrib tarball
        if: steps.contrib.outputs.available == 'yes'
        id: contrib-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/contrib-cache
          key: vlc-contrib-${{ env.TRIPLET }}-${{ steps.contrib.outputs.sha }}

      - name: Download prebuilt contribs
        if: steps.contrib.outputs.available == 'yes' && steps.contrib-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/contrib-cache"
          curl -fL --retry 3 -o "$RUNNER_TEMP/contrib-cache/contrib.tar.zst" "${{ steps.contrib.outputs.url }}"

      - name: Stage prebuilt contribs
        if: steps.contrib.outputs.available == 'yes'
        run: |
          # `make prebuilt` (contrib/src/main.mak) skips the download when this
          # file already exists in the contrib build dir.
          mkdir -p contrib/contrib-win64
          ln -f "$RUNNER_TEMP/contrib-cache/contrib.tar.zst" \
                "contrib/contrib-win64/vlc-contrib-${TRIPLET}-latest.tar.zst" \
            || cp "$RUNNER_TEMP/contrib-cache/contrib.tar.zst" \
                  "contrib/contrib-win64/vlc-contrib-${TRIPLET}-latest.tar.zst"

      - name: Pull build image
        run: docker pull "$VLC_WIN64_IMAGE"

      - name: Build VLC and package installer
        env:
          VLC_PREBUILT_CONTRIBS_URL: ${{ steps.contrib.outputs.available == 'yes' && steps.contrib.outputs.url || '' }}
        run: |
          # The image runs as the unprivileged "videolan" user (its wine
          # prefix and rust toolchain live there), so hand it the checkout.
          sudo chown -R "$VIDEOLAN_UID:$VIDEOLAN_UID" "$GITHUB_WORKSPACE"
          # -p: use prebuilt contribs (falls back to a source build on failure)
          # -l: enable translations
          # -r / -i r: release build, then `make package-win32`
          #            (NSIS .exe + portable .zip/.7z; no MSI, which needs WiX)
          # Qt (QML) and skins2 interfaces are enabled by build.sh by default.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/build/vlc" -w /build/vlc \
            -e VLC_PREBUILT_CONTRIBS_URL \
            "$VLC_WIN64_IMAGE" \
            extras/package/win32/build.sh -a x86_64 -p -l -r -i r

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: List packages
        run: |
          ls -la win64/vlc-*-win64.* || true
          df -h /

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vlc-win64-installer
          path: win64/vlc-*-win64.exe
          if-no-files-found: error
          compression-level: 0  # already LZMA-compressed by NSIS
          retention-days: 14

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: vlc-win64-portable
          path: win64/vlc-*-win64.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
